.note.err { color: var(--err); font-weight: 600; }

/* steps, info strip, floating chat button */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; counter-reset: s; }
.steps li { counter-increment: s; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 16px 70px; position: relative; min-width: 0; }
.steps li::before { content: counter(s); position: absolute; left: 16px; top: 16px; width: 42px; height: 42px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 1.6rem; }

@media (max-width: 480px) { .fab span { display: none; } .fab { padding: 0 14px; } }

/* ===== LUXE THEME: warm black, champagne gold, ivory; serif headings; centred editorial layout ===== */
:root {
  --bg: #0b0908; --surface: #15120f; --surface-2: #1d1914; --line: #3b3226;
  --text: #f6f0e4; --muted: #c3b9a6; --tint: #1c1710; --glass: rgba(11,9,8,.94); --err: #ff9a9f;
  --font-display: "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  --font-body: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gold-ink: #17110a;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg: #f8f3e9; --surface: #fffdf8; --surface-2: #f0e9da; --line: #d9cdb4; --text: #1b1610; --muted: #5d5445; --tint: #f3ecdb; --glass: rgba(248,243,233,.95); --err: #a3202b; }
}
:root[data-theme="light"] { --bg: #f8f3e9; --surface: #fffdf8; --surface-2: #f0e9da; --line: #d9cdb4; --text: #1b1610; --muted: #5d5445; --tint: #f3ecdb; --glass: rgba(248,243,233,.95); --err: #a3202b; }
.band-dark { --bg: #0b0908; --surface: #15120f; --surface-2: #1d1914; --line: #3b3226; --text: #f6f0e4; --muted: #c3b9a6; --tint: #1c1710; --err: #ff9a9f; }

body { font-weight: 400; letter-spacing: .005em; }
.display { font-style: normal; font-weight: 600; text-transform: none; letter-spacing: 0; line-height: 1.04; }
.eyebrow { font-family: var(--font-body); font-weight: 500; font-size: .78rem; letter-spacing: .32em; }

/* header: menu left, name centred, cart right */
.top { padding-block: 14px; }
.top .wrap { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; }
.nav { order: 1; justify-self: start; font-family: var(--font-body); font-weight: 500; font-size: .78rem; letter-spacing: .2em; gap: 26px; }
.brand { order: 2; flex: none; justify-self: center; flex-direction: column; text-align: center; gap: 4px; }
.hdr-r { order: 3; justify-self: end; }
.brand-mark { width: 34px; height: 34px; }
.brand-name { font-style: normal; font-weight: 600; text-transform: none; font-size: 1.9rem; line-height: 1; letter-spacing: .02em; }
.brand-tag { font-weight: 500; font-size: .6rem; letter-spacing: .34em; margin-top: 6px; }
.themebtn, .cart-btn { border-width: 1px; }
.cart-btn { border-radius: 0; font-family: var(--font-body); font-weight: 500; letter-spacing: .14em; text-transform: uppercase; font-size: .78rem; }
.badge { border-radius: 0; background: var(--blue); color: var(--gold-ink); }

/* buttons: square, gold */
.btn { border-radius: 0; font-family: var(--font-body); font-weight: 500; letter-spacing: .2em; text-transform: uppercase; font-size: .8rem; padding: 16px 28px; }
.btn-red { background: linear-gradient(135deg, #e3c887, var(--blue) 55%, #a98337); color: var(--gold-ink); border-color: transparent; }
.btn-red:hover { background: linear-gradient(135deg, #f0d99c, #d9b66c 55%, #b9923f); }
.btn-ghost { border: 1px solid var(--blue); color: var(--text); }
.btn-ghost:hover, .cart-btn:hover, .chip[aria-pressed=true], .qty button:hover, .cp:hover { background: var(--blue); color: var(--gold-ink); border-color: var(--blue); }
.btn-wa { background: #1f7a46; color: #fff; }
.btn-sm { font-size: .72rem; padding: 10px 18px; }

/* hero: centred, logo above the headline */
.hero { padding-block: 44px 34px; }
.hero-grid { grid-template-columns: 1fr; gap: 34px; text-align: center; justify-items: center; }
.hero-grid > div:first-child { display: flex; flex-direction: column; align-items: center; order: 2; }
.hero-art { order: 1; width: min(calc(100% - 20px), 400px); margin-block: 0; }
.hero-art::before { inset: -10px; transform: none; border: 1px solid var(--blue); background: none; border-radius: 0; }
.hero-art::after { content: ""; position: absolute; inset: -18px; border: 1px solid color-mix(in srgb, var(--blue) 40%, transparent); pointer-events: none; }
.logo-card { background: #070605; border: 0; border-radius: 0; }
.hero h1 { font-size: clamp(2.9rem, 9vw, 5.6rem); font-weight: 500; line-height: 1; margin: 14px 0 18px; }
.hero h1 .b { font-style: italic; }
.lede { font-size: 1.15rem; max-width: 46ch; }
.cta-row { justify-content: center; }

/* section headings: centred with a hairline ornament */
.sec-head { text-align: center; margin-bottom: 30px; }
.sec-head h2 { font-size: clamp(2.2rem, 6.5vw, 3.6rem); font-weight: 500; }
.sec-head .bar { width: 64px; height: 1px; transform: none; background: var(--blue); margin: 16px auto 0; position: relative; }
.sec-head .bar::after { content: ""; position: absolute; left: 50%; top: -3px; width: 7px; height: 7px; background: var(--bg); border: 1px solid var(--blue); transform: translateX(-50%) rotate(45deg); }
.sec-head p { margin-inline: auto; margin-top: 18px; }
section { padding-block: 34px 52px; }

/* deal strip */
.deal { border-radius: 0; background: linear-gradient(100deg, #2a0c14, var(--red) 60%, #2a0c14); border: 1px solid var(--blue); margin-bottom: 36px; }
.deal .tag { font-style: normal; font-weight: 600; text-transform: none; font-size: 2.2rem; }
.deal .count { border-radius: 0; font-family: var(--font-body); font-weight: 500; font-size: 1.05rem; border: 1px solid var(--blue); }
.deal .btn { background: var(--blue); color: var(--gold-ink); }

/* promises: open row with hairlines */
.benefits { gap: 0; padding-block: 8px 44px; border-block: 1px solid var(--line); margin-bottom: 20px; }
.benefit { background: none; border: 0; border-radius: 0; flex-direction: column; text-align: center; padding: 26px 14px; gap: 12px; }
.benefit + .benefit { border-left: 1px solid var(--line); }
.benefit .ring { border: 1px solid var(--blue); width: 58px; height: 58px; color: var(--blue); }
.benefit b { font-family: var(--font-body); font-weight: 500; font-size: .8rem; letter-spacing: .22em; }
.benefits { padding-bottom: 8px; }

/* how it works */
.steps li { border-radius: 0; background: none; border: 0; border-top: 1px solid var(--blue); padding: 22px 6px 6px; text-align: center; }
.steps li::before { position: static; display: block; width: auto; height: auto; background: none; color: var(--blue); font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 3rem; line-height: 1; margin-bottom: 6px; border-radius: 0; }
.steps b { font-family: var(--font-display); text-transform: none; letter-spacing: 0; font-size: 1.6rem; font-weight: 600; }

/* shop */
.search { border-radius: 0; border-width: 1px; }
.chip { border-radius: 0; font-family: var(--font-body); font-weight: 500; font-size: .74rem; letter-spacing: .16em; text-transform: uppercase; padding: 10px 18px; }
.toolbar { justify-content: center; }
.infostrip { border-radius: 0; justify-content: center; background: none; border-inline: 0; font-weight: 500; letter-spacing: .02em; }
.products { gap: 28px; }
.product { border-radius: 0; background: var(--surface); border: 1px solid var(--line); position: relative; }
.product::after { content: ""; position: absolute; inset: 7px; border: 1px solid color-mix(in srgb, var(--blue) 30%, transparent); pointer-events: none; }
.p-media { background: radial-gradient(circle at 50% 35%, #2b2216, #090705 72%); }
.p-size { background: none; border: 1px solid var(--blue); color: var(--blue); transform: none; font-family: var(--font-body); font-style: normal; font-weight: 500; letter-spacing: .14em; font-size: .85rem; padding: 5px 12px; top: 20px; left: 20px; }
.p-bf { background: var(--red); border-radius: 0; font-family: var(--font-body); font-weight: 500; letter-spacing: .16em; font-size: .7rem; padding: 6px 10px; top: 20px; right: 20px; color: #fff; }
.p-body { padding: 26px 24px 24px; text-align: center; align-items: center; }
.p-body > * { max-width: 100%; }
.brand-chip { align-self: center; border: 0; border-bottom: 1px solid var(--blue); border-radius: 0; font-family: var(--font-body); font-weight: 500; letter-spacing: .3em; font-size: .72rem; padding: 0 0 5px; }
.p-body h3 { font-size: 2.3rem; font-weight: 500; }
.p-body h3 small { font-family: var(--font-body); }
.ticks li::before { background: var(--blue); }
.p-body .ticks { text-align: left; }
.p-price { justify-content: center; }
.now { font-style: normal; font-weight: 500; font-size: 3.4rem; color: var(--blue); }
.was { font-weight: 500; text-decoration-thickness: 1px; }
.per { letter-spacing: .18em; font-size: .75rem; }
.p-buy { width: 100%; justify-content: center; }

d cleaning products from trusted brands together in one place, so you can find what you need and order it easily.","We are not a single brand. **SUPCO**, the maker of SUP50 Heavy Duty, is the first brand on our shelf, and we are adding more cleaning products from different companies all the time.","Our promise is simple: quality products, fast and reliable service, and being the cleaning partner you can count on."],"brandsTitle":"Brands we supply","brands":[{"name":"SUPCO","note":"Heavy duty cleaners & degreasers"}],"brandsNote":"More brands coming soon."},"faq":{"eyebrow":"Questions","title":"Frequently asked","items":[{"q":"How do I order?","a":"Add products to your cart, tap Checkout, fill in your details and choose delivery or collection. Then tap the green WhatsApp button. Your full order opens in WhatsApp, ready to send. We reply to confirm it."},{"q":"How do I pay?","a":"At checkout you choose how you want to pay. If you choose EFT, our banking details appear on the next screen. Use your order reference when you pay and send the proof of payment on WhatsApp. You can also choose to pay on delivery or collection."},{"q":"What does delivery cost?","a":"Delivery prices: {delivery} Choose your area at checkout and the fee is added to your total. Collection is free."},{"q":"Can I collect my order instead?","a":"Yes. Choose Collection at checkout. You collect at {collection}. We confirm a time with you on WhatsApp first."},{"q":"Do you supply businesses?","a":"Yes. Tap Request a quote or choose Business at checkout and tell us what you need. We can help with larger sizes and regular orders."},{"q":"Is SUP50 Heavy Duty safe on my surface?","a":"SUP50 is made for washable surfaces and is described as safe on most surfaces. Always follow the label and test a small hidden spot first. If you are unsure, message us and we will help."},{"q":"What is the difference between The Cleaning Hub and SUPCO?","a":"The Cleaning Hub is the supplier you order from. SUPCO is one of the var $ = function (s) { return document.querySelector(s); };
var fmt = function (n) { return "R" + Number(n).toLocaleString("en-ZA"); };
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }

function tickDeal() {

  if (!S.bfEnabled || left <= 0 || !specials.length) {
    var was = !box.hidden; box.hidden = true;

    return;
  }
  if (box.hidden) { box.hidden = false; }
  var d = Math.floor(left / 864e5), h = Math.floor(left % 864e5 / 36e5), m = Math.floor(left % 36e5 / 6e4);

  if (Number(z.freeOver) > 0 && total() >= Number(z.freeOver)) return { kind: "free", fee: 0, zone: z };

function legacyCopy(t) {
  var ta = document.createElement("textarea");
  ta.value = t; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
  document.body.appendChild(ta);
  var ok = false;
  try { ta.focus(); ta.select(); ta.setSelectionRange(0, t.length); ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}
/* One tap copies. Tries the browser clipboard first, then the older method that works inside locked-down frames. */
function copyText(t, msg, anchor) {
  var done = function () { toast(msg); };
  var last = function () {
    if (legacyCopy(t)) { done(); return; }
    /* Last resort: show the text selected so one tap on Copy in the phone's menu finishes it. */
    if (anchor && !anchor.querySelector(".copybox")) {
      var box = el("textarea", { "class": "copybox", readonly: "", rows: "5", "aria-label": "Message to copy" }); box.value = t;
      anchor.appendChild(box); box.focus(); box.select(); try { box.setSelectionRange(0, t.length); } catch (e) {}
    }
    toast("Tap Copy in the menu that appears");
  };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, last); else last(); } catch (e) { last(); }
}

  if (t === "help") return { hi: "I need help choosing a product for: " + about + ".", label: "Tell us about the job", ph: "e.g. Grease on my kitchen tiles", lead: "Tell us what you are cleaning and we will suggest the right product." };
  if (t === "missing") return { hi: "I am looking for a product that is not on the website.", label: "What are you looking for?", ph: "Product name, brand or what it must do", lead: "Tell us what you need and we will check if we can get it." };
  return { hi: "I have a question.", label: "Your message", ph: "Type your question here", lead: "Send us a message on WhatsApp." };
}
